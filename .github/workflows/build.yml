name: Build and test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build pkg-config libgtk-4-dev libjson-glib-dev xvfb xauth weston
      - run: cmake --preset dev
      - run: cmake --build --preset dev --parallel 4
      - run: ctest --preset dev
      - run: dbus-run-session -- xvfb-run -a bash tests/ui/desktop-smoke.sh build/dev/bin x11
      - run: dbus-run-session -- bash tests/ui/desktop-smoke.sh build/dev/bin wayland
      - name: Install and exercise the DEB on a fresh Ubuntu runtime
        run: |
          cmake --preset release -DBUILD_TESTING=OFF
          cmake --build --preset release --parallel 4
          cpack --config build/release/CPackConfig.cmake -G DEB -B build/ci-deb
          docker run --rm --platform linux/amd64 \
            --mount "type=bind,src=$PWD/build/ci-deb,dst=/packages,readonly" \
            --mount "type=bind,src=$PWD/tests/ui,dst=/tests,readonly" \
            ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5 bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                /packages/diskscope_*_amd64.deb dbus-daemon xvfb xauth fonts-noto-cjk
              for tool in gcc cmake ninja; do
                if command -v "$tool"; then exit 1; fi
              done
              runuser -u nobody -- dbus-run-session -- xvfb-run -a bash /tests/desktop-smoke.sh /usr/bin x11
            '

  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-json-glib
      - run: cmake --preset dev
      - run: cmake --build --preset dev --parallel 4
      - run: ctest --preset dev
